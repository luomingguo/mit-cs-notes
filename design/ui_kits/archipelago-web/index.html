<!-- @dsCard group="Archipelago Web" viewport="1280x860" name="Archipelago 群岛 · 阅读站" subtitle="Click-through: atlas home → domain → lecture reading view → concept page, plus ⌘K search" -->
<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Archipelago 群岛</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/logo-archipelago-badge-64.png">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%}#root{min-height:100%}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="AtlasHome.jsx"></script>
<script type="text/babel" src="DomainScreen.jsx"></script>
<script type="text/babel" src="LectureScreen.jsx"></script>
<script type="text/babel" src="ConceptScreen.jsx"></script>
<script type="text/babel" src="SearchOverlay.jsx"></script>
<script type="text/babel" data-presets="react">
const { Toast, Button } = window.ArchipelagoDesignSystem_958ced;
function App(){
  const [view,setView]=React.useState('home');
  const [concept,setConcept]=React.useState('无知之幕');
  const [search,setSearch]=React.useState(false);
  const [toast,setToast]=React.useState(false);
  React.useEffect(()=>{
    const onKey=(e)=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setSearch(true);}
      if(e.key==='Escape')setSearch(false);
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[]);
  React.useEffect(()=>{window.scrollTo(0,0)},[view,concept]);
  const nav=(v)=>{setSearch(false);setView(v)};
  const openConcept=(c)=>{setConcept(c);setSearch(false);setView('concept')};
  const openNote=()=>{setSearch(false);setView('lecture')};
  const log=()=>{setToast(true);window.setTimeout(()=>setToast(false),2600)};
  return (<>
    <window.Shell view={view} onNav={nav} onSearch={()=>setSearch(true)}>
      {view==='home'&&<window.AtlasHome onNav={nav} onOpenNote={openNote}/>}
      {view==='domain'&&<window.DomainScreen onNav={nav} onOpenNote={openNote} onOpenConcept={openConcept}/>}
      {view==='lecture'&&<window.LectureScreen onOpenConcept={openConcept} onLog={log}/>}
      {view==='concept'&&<window.ConceptScreen label={concept} onOpenNote={openNote}/>}
    </window.Shell>
    <window.SearchOverlay open={search} onClose={()=>setSearch(false)} onPick={(t)=>{ if(t.length>4){openNote()}else{openConcept(t)} }}/>
    {toast&&<div style={{position:'fixed',left:24,bottom:24,zIndex:80}}><Toast tone="success" title="已加入航海日志" onDismiss={()=>setToast(false)}>这一讲会出现在你的日志首页。</Toast></div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
