<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 22px;background:var(--surface-page);background-image:var(--texture-paper);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:70px;border-radius:var(--radius-xs);border:1px solid rgba(0,26,61,.06)}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-body);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);white-space:nowrap}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--kelp-600)"></div><div class="n">--kelp-600</div><div class="h">success</div></div><div class="sw"><div class="chip" style="background:var(--kelp-200)"></div><div class="n">--kelp-200</div><div class="h">tint</div></div><div class="sw"><div class="chip" style="background:var(--coral-600)"></div><div class="n">--coral-600</div><div class="h">danger</div></div><div class="sw"><div class="chip" style="background:var(--coral-200)"></div><div class="n">--coral-200</div><div class="h">tint</div></div><div class="sw"><div class="chip" style="background:var(--gold-500)"></div><div class="n">--gold-500</div><div class="h">warning</div></div><div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="n">--navy-700</div><div class="h">info</div></div></div>
</body></html>
