<!-- @dsCard group="Brand" viewport="700x210" name="Three worlds" subtitle="Paper reads, abyss frames, chart connects. Never more than two on one screen." -->
<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 22px;background:var(--surface-page);background-image:var(--texture-paper);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:70px;border-radius:var(--radius-xs);border:1px solid rgba(0,26,61,.06)}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-body);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);white-space:nowrap}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:150px"><div style="background:var(--surface-card);background-image:var(--texture-paper);border:1px solid var(--border-hairline);border-radius:var(--radius-sm);padding:14px"><div class="lbl">01 · PAPER</div><div style="font:var(--fw-semibold) 17px/1.4 var(--font-display);color:var(--text-heading);margin-top:8px">纸面</div><div style="font:var(--fw-regular) 13px/1.7 var(--font-serif);color:var(--text-muted);margin-top:6px">阅读发生的地方</div></div><div style="background:var(--gradient-abyss);background-image:var(--gradient-abyss),var(--texture-chart);border-radius:var(--radius-sm);padding:14px"><div class="lbl" style="color:var(--gold-400)">02 · ABYSS</div><div style="font:var(--fw-semibold) 17px/1.4 var(--font-display);color:var(--paper-50);margin-top:8px">深海</div><div style="font:var(--fw-regular) 13px/1.7 var(--font-serif);color:var(--text-inverse-muted);margin-top:6px">用来框住，不用来阅读</div></div><div style="background:var(--ocean-100);border:1px solid rgba(15,92,147,.18);border-radius:var(--radius-sm);padding:14px"><div class="lbl" style="color:var(--ocean-700)">03 · CHART</div><div style="font:var(--fw-semibold) 17px/1.4 var(--font-display);color:var(--ocean-700);margin-top:8px">航线</div><div style="font:var(--fw-regular) 13px/1.7 var(--font-serif);color:var(--ocean-700);margin-top:6px">线、点、一个词——不做大面积填色</div></div></div>
</body></html>
