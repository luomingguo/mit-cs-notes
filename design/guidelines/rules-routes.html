<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 22px;background:var(--surface-page);background-image:var(--texture-paper);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:70px;border-radius:var(--radius-xs);border:1px solid rgba(0,26,61,.06)}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-body);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);white-space:nowrap}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:16px"><div><div style="border-top:1px solid var(--border-hairline)"></div><div class="h" style="margin-top:6px">--border-hairline · structure</div></div><div><div style="border-top:1px dashed var(--route-line)"></div><div class="h" style="margin-top:6px">--route-line · 航线 · connects, separates a note from its “next”</div></div><div><div style="height:1px;background:linear-gradient(90deg,transparent,var(--rule-gold) 18%,var(--rule-gold) 82%,transparent)"></div><div class="h" style="margin-top:6px">--rule-gold · chapter break, max twice per page</div></div><div style="display:flex;align-items:center;gap:12px"><span style="flex:1;border-top:1px dashed var(--route-line)"></span><span class="lbl">航线</span><span style="flex:1;border-top:1px dashed var(--route-line)"></span></div></div>
</body></html>
