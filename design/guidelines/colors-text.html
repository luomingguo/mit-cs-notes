<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 22px;background:var(--surface-page);background-image:var(--texture-paper);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:70px;border-radius:var(--radius-xs);border:1px solid rgba(0,26,61,.06)}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-body);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);white-space:nowrap}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px"><div><div style="font:var(--fw-semibold) 19px/1.3 var(--font-display);color:var(--text-heading)">这篇在讲什么</div><div class="h">--text-heading</div></div><div><div style="font:var(--fw-regular) 16px/1.5 var(--font-serif);color:var(--text-body)">正文：需要先读什么</div><div class="h">--text-body</div></div><div><div style="font:var(--fw-regular) 15px/1.5 var(--font-sans);color:var(--text-muted)">次要说明文字</div><div class="h">--text-muted</div></div><div><div style="font:var(--fw-regular) 13px/1.5 var(--font-sans);color:var(--text-faint)">约 12 分钟 · 三天前</div><div class="h">--text-faint</div></div><div><a href="#" style="font:var(--fw-regular) 16px/1.5 var(--font-serif)">未读的内部链接</a><div class="h">--text-link</div></div><div><span style="font:var(--fw-regular) 16px/1.5 var(--font-serif);color:var(--text-link-visited);text-decoration:underline;text-decoration-color:rgba(11,77,125,.4);text-underline-offset:.22em">已读过的链接</span><div class="h">--text-link-visited</div></div></div>
</body></html>
