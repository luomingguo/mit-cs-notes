<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 22px;background:var(--surface-page);background-image:var(--texture-paper);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:70px;border-radius:var(--radius-xs);border:1px solid rgba(0,26,61,.06)}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-body);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);white-space:nowrap}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}.mo{padding:0}.mo .bar{height:44px;background:var(--ocean-500);border-radius:var(--radius-xs);transform-origin:left center;transform:scaleX(.28)}.mo:hover .bar{transform:scaleX(1)}</style></head><body>
<div style="display:flex;gap:14px"><div class="mo" style="flex:1"><div class="bar" style="transition:transform 340ms cubic-bezier(.22,.61,.36,1)"></div><div class="n">--ease-tide</div><div class="h">140ms · state changes</div></div><div class="mo" style="flex:1"><div class="bar" style="transition:transform 340ms cubic-bezier(.16,1,.3,1)"></div><div class="n">--ease-out-soft</div><div class="h">220–340ms · entrances</div></div><div class="mo" style="flex:1"><div class="bar" style="transition:transform 340ms cubic-bezier(.5,0,.2,1)"></div><div class="n">--ease-in-out-sea</div><div class="h">560ms · route draw</div></div></div><div class="h" style="margin-top:12px">no bounce · no spring overshoot · entrances are opacity + 6–8px translate · prefers-reduced-motion zeroes every duration</div>
</body></html>
