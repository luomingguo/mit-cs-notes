<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{padding:22px;background:var(--surface-page);background-image:var(--texture-paper);font:var(--type-body)}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.ArchipelagoDesignSystem_958ced;
const { Input, Select, Textarea, Checkbox, Radio, Switch, Divider } = NS;
function Demo(){return (<div className="col">
<div className="grid2">
<Input label="搜索" icon="search" placeholder="搜索讲义、概念、课程" suffix="⌘K" defaultValue=""/>
<Select label="排序" options={["按课程顺序","最近更新","引用最多"]}/>
<Input label="邮箱" defaultValue="reader@" error="这个地址看起来不完整"/>
<Input label="课程代码" hint="可留空" placeholder="ER 22"/>
</div>
<Textarea label="摘要" rows={2} placeholder="一到两句话说明这篇在讲什么"/>
<Divider variant="route" />
<div className="grid2">
<div className="col" style={{gap:10}}><Checkbox label="只看有反向链接的讲义" defaultChecked/><Checkbox label="包含未整理的草稿" hint="草稿不会出现在领域索引里"/><Switch label="显示反向链接" defaultChecked/><Switch label="夜航模式"/></div>
<Radio defaultValue="course" options={[{value:"course",label:"按课程顺序",hint:"保留讲课的原始脉络"},{value:"concept",label:"按概念聚合"},{value:"time",label:"按整理时间"}]}/>
</div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
