<h2 class="sr-only">Interactive 4-bit two's complement number wheel showing wraparound modular arithmetic</h2>
<style>
  .ctrl{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px;color:var(--color-text-secondary)}
  .ctrl select,.ctrl button{font-size:13px;padding:4px 10px}
  .result{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:10px 0;min-height:22px}
  .note{font-size:13px;color:var(--color-text-secondary);margin:6px 0;line-height:1.6}
</style>

<svg id="wheel" width="100%" viewBox="0 0 680 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

<div class="ctrl">
  <span>计算：</span>
  <select id="selA"></select>
  <select id="selOp"><option value="add">+</option><option value="sub">−</option></select>
  <select id="selB"></select>
  <button onclick="doCalc()">计算 ↗</button>
</div>
<div class="result" id="res"></div>
<div class="note" id="explain"></div>

<script>
const CX=260,CY=200,R=155,N=16;
const vals=[];
for(let i=0;i<N;i++){
  let v=i;if(v>=8)v=v-16;
  vals.push(v);
}

const svg=document.getElementById('wheel');
const ns='http://www.w3.org/2000/svg';
function el(tag,attrs){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}

const circles=[],labels=[];
for(let i=0;i<N;i++){
  const ang=(i/N)*Math.PI*2 - Math.PI/2;
  const x=CX+R*Math.cos(ang), y=CY+R*Math.sin(ang);
  const g=document.createElementNS(ns,'g');
  const c=el('circle',{cx:x,cy:y,r:22,fill:'var(--color-background-secondary)',stroke:'var(--color-border-secondary)','stroke-width':'0.5'});
  const bin=i.toString(2).padStart(4,'0');
  const t1=el('text',{x:x,y:y-5,'text-anchor':'middle','dominant-baseline':'central','font-size':'13px','font-weight':'500',fill:'var(--color-text-primary)'});
  t1.textContent=String(vals[i]);
  const t2=el('text',{x:x,y:y+9,'text-anchor':'middle','dominant-baseline':'central','font-size':'9px',fill:'var(--color-text-secondary)'});
  t2.textContent=bin;
  g.appendChild(c);g.appendChild(t1);g.appendChild(t2);
  svg.appendChild(g);
  circles.push(c);labels.push(g);
}

const labelPlus=el('text',{x:CX,y:CY-30,'text-anchor':'middle','font-size':'12px',fill:'var(--color-text-secondary)'});
labelPlus.textContent='顺时针 = 加法（+）';
svg.appendChild(labelPlus);
const labelMinus=el('text',{x:CX,y:CY+10,'text-anchor':'middle','font-size':'12px',fill:'var(--color-text-secondary)'});
labelMinus.textContent='逆时针 = 减法（−）';
svg.appendChild(labelMinus);
const labelMod=el('text',{x:CX,y:CY-12,'text-anchor':'middle','font-size':'11px',fill:'var(--color-text-tertiary)'});
labelMod.textContent='mod 16';
svg.appendChild(labelMod);

const legendY=50;
const lg1=el('text',{x:500,y:legendY,'font-size':'12px',fill:'var(--color-text-secondary)'});
lg1.textContent='正数区间：0 到 7';
svg.appendChild(lg1);
const lg2=el('text',{x:500,y:legendY+20,'font-size':'12px',fill:'var(--color-text-secondary)'});
lg2.textContent='负数区间：−8 到 −1';
svg.appendChild(lg2);
const lc1=el('circle',{cx:490,cy:legendY-4,r:5,fill:'#85B7EB',opacity:'0.7'});
svg.appendChild(lc1);
const lc2=el('circle',{cx:490,cy:legendY+16,r:5,fill:'#F09595',opacity:'0.7'});
svg.appendChild(lc2);

for(let i=0;i<N;i++){
  circles[i].setAttribute('fill', vals[i]>=0 ? '#E6F1FB' : '#FCEBEB');
  circles[i].setAttribute('stroke', vals[i]>=0 ? '#85B7EB' : '#F09595');
}

let arcPath=null,dotA=null,dotB=null;
function clearArc(){
  if(arcPath){arcPath.remove();arcPath=null}
  if(dotA){dotA.remove();dotA=null}
  if(dotB){dotB.remove();dotB=null}
  circles.forEach((c,i)=>{
    c.setAttribute('fill', vals[i]>=0 ? '#E6F1FB' : '#FCEBEB');
    c.setAttribute('stroke', vals[i]>=0 ? '#85B7EB' : '#F09595');
    c.setAttribute('stroke-width','0.5');
  });
}

function posOf(idx){
  const ang=(idx/N)*Math.PI*2 - Math.PI/2;
  return [CX+R*Math.cos(ang), CY+R*Math.sin(ang)];
}

function drawArc(fromIdx,toIdx,clockwise){
  clearArc();
  circles[fromIdx].setAttribute('fill','#378ADD');circles[fromIdx].setAttribute('stroke','#185FA5');circles[fromIdx].setAttribute('stroke-width','2');
  circles[toIdx].setAttribute('fill','#639922');circles[toIdx].setAttribute('stroke','#3B6D11');circles[toIdx].setAttribute('stroke-width','2');

  const [x1,y1]=posOf(fromIdx);
  const [x2,y2]=posOf(toIdx);
  const Rarc=R+32;

  let steps;
  if(clockwise){
    steps=(toIdx-fromIdx+N)%N;
  } else {
    steps=(fromIdx-toIdx+N)%N;
  }
  if(steps===0){
    document.getElementById('res').textContent='';
    return;
  }

  const angStart=(fromIdx/N)*Math.PI*2 - Math.PI/2;
  const angEnd=clockwise? angStart+(steps/N)*Math.PI*2 : angStart-(steps/N)*Math.PI*2;
  const ax1=CX+Rarc*Math.cos(angStart), ay1=CY+Rarc*Math.sin(angStart);
  const ax2=CX+Rarc*Math.cos(angEnd), ay2=CY+Rarc*Math.sin(angEnd);

  const largeArc=steps>N/2?1:0;
  const sweep=clockwise?1:0;

  const p=el('path',{d:`M${ax1} ${ay1} A${Rarc} ${Rarc} 0 ${largeArc} ${sweep} ${ax2} ${ay2}`,fill:'none',stroke:'#BA7517','stroke-width':'2','stroke-dasharray':'6 4','marker-end':'url(#arrow)',opacity:'0.8'});
  svg.insertBefore(p,svg.firstChild.nextSibling);
  arcPath=p;
}

const selA=document.getElementById('selA');
const selB=document.getElementById('selB');
for(let i=0;i<N;i++){
  const o1=document.createElement('option');o1.value=i;o1.textContent=vals[i];selA.appendChild(o1);
  const o2=document.createElement('option');o2.value=i;o2.textContent=vals[i];selB.appendChild(o2);
}
selA.value=5; selB.value=14;

function doCalc(){
  clearArc();
  const ai=parseInt(selA.value);
  const bi=parseInt(selB.value);
  const op=document.getElementById('selOp').value;
  const a=vals[ai],b=vals[bi];

  let resultIdx,resultVal,steps,clockwise;
  if(op==='add'){
    resultIdx=(ai+bi)%N;
    resultVal=vals[resultIdx];
    clockwise=true;
    steps=bi>=0;
    if(b>=0){clockwise=true;}else{clockwise=false;}
    let rawSteps=b>=0?bi:(N-bi)%N;
    drawArc(ai,resultIdx,b>=0);
    const raw=a+b;
    const wrapped=resultVal;
    let exp='';
    if(raw>7||raw<-8){
      exp=`${a} + ${b} = ${raw}，超出 4 位补码范围 [−8, 7]，对 16 取模后得到 ${wrapped}（环绕）`;
    } else {
      exp=`${a} + ${b} = ${wrapped}，在范围内，无环绕`;
    }
    document.getElementById('res').textContent=`${a} + (${b}) = ${wrapped}`;
    document.getElementById('explain').textContent=exp;
  } else {
    let subSteps=(bi)%N;
    resultIdx=((ai-bi)%N+N)%N;
    resultVal=vals[resultIdx];
    if(b>=0){clockwise=false;}else{clockwise=true;}
    drawArc(ai,resultIdx,!( b>=0));
    const raw=a-b;
    const wrapped=resultVal;
    let exp='';
    if(raw>7||raw<-8){
      exp=`${a} − (${b}) = ${raw}，超出范围，对 16 取模后得到 ${wrapped}（环绕）`;
    } else {
      exp=`${a} − (${b}) = ${wrapped}，在范围内，无环绕`;
    }
    document.getElementById('res').textContent=`${a} − (${b}) = ${wrapped}`;
    document.getElementById('explain').textContent=exp;
  }
}
doCalc();
</script>
