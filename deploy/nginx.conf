# mit-cs-notes 静态站点服务配置，挂载到 /etc/nginx/conf.d/default.conf。
# 前面还有一层 Caddy（负责 TLS 与 gzip），所以这里不重复做压缩。
server {
    listen 80;
    server_name _;

    # 指向软链，CI 发布时切换软链即可生效
    root /srv/notes/current;
    index index.html;

    location / {
        # Astro 使用目录式静态路由；同时兼容现有的 .html 外部链接
        try_files $uri $uri/ $uri.html =404;
        # HTML 不缓存，发布后浏览器立刻拿到新版本
        add_header Cache-Control "no-cache";
    }

    # 带内容 hash 的静态资源，文件名变则内容变，可以长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log off;
}
