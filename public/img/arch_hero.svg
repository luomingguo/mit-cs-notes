<svg width="100%" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>计算机架构主题插图</title>
  <desc>自底向上的计算机架构层次插图：数字逻辑、数据通路、流水线微架构、缓存层次、多核处理器，周围环绕电路走线，配色与站点 logo 一致（MIT 枣红、奶白、金色）。</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A31F34" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D9A94E" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="240" cy="240" r="220" fill="url(#archBg)"/>

  <!-- 电路走线装饰（替代网络节点） -->
  <g stroke="#D9A94E" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M52 108 H94 V138"/>
    <path d="M52 162 H84"/>
    <path d="M428 98 H388 V128"/>
    <path d="M428 158 H392"/>
    <path d="M48 338 H86 V372"/>
    <path d="M48 398 H80"/>
    <path d="M432 328 H394 V362"/>
    <path d="M432 392 H396"/>
  </g>
  <!-- 电路焊盘 -->
  <g fill="#D9A94E" opacity="0.85">
    <rect x="48" y="104" width="8" height="8" rx="1"/>
    <circle cx="94" cy="138" r="4"/>
    <rect x="48" y="158" width="8" height="8" rx="1"/>
    <rect x="424" y="94" width="8" height="8" rx="1"/>
    <circle cx="388" cy="128" r="4"/>
    <rect x="424" y="154" width="8" height="8" rx="1"/>
    <rect x="44" y="334" width="8" height="8" rx="1"/>
    <circle cx="86" cy="372" r="4"/>
    <rect x="44" y="394" width="8" height="8" rx="1"/>
    <rect x="428" y="324" width="8" height="8" rx="1"/>
    <circle cx="394" cy="362" r="4"/>
    <rect x="428" y="388" width="8" height="8" rx="1"/>
  </g>

  <!-- 架构分层栈：从下到上 -->

  <!-- 第1层：数字逻辑 -->
  <rect x="120" y="368" width="240" height="44" rx="8" fill="#A31F34"/>
  <!-- IC 芯片图标：矩形主体 + 引脚 -->
  <g fill="#F2EDE3">
    <rect x="146" y="377" width="34" height="24" rx="2"/>
    <!-- 顶部引脚 -->
    <rect x="152" y="373" width="4" height="5" rx="1"/>
    <rect x="160" y="373" width="4" height="5" rx="1"/>
    <rect x="168" y="373" width="4" height="5" rx="1"/>
    <!-- 底部引脚 -->
    <rect x="152" y="400" width="4" height="5" rx="1"/>
    <rect x="160" y="400" width="4" height="5" rx="1"/>
    <rect x="168" y="400" width="4" height="5" rx="1"/>
    <!-- 左侧引脚 -->
    <rect x="141" y="381" width="5" height="4" rx="1"/>
    <rect x="141" y="389" width="5" height="4" rx="1"/>
    <!-- 右侧引脚 -->
    <rect x="180" y="381" width="5" height="4" rx="1"/>
    <rect x="180" y="389" width="5" height="4" rx="1"/>
  </g>
  <text x="163" y="393" font-size="7" font-weight="800" text-anchor="middle" fill="#A31F34">AND</text>
  <text x="310" y="395" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5" fill="#F2EDE3">数字逻辑</text>

  <!-- 第2层：数据通路 -->
  <rect x="100" y="312" width="280" height="44" rx="8" fill="#8a1b2c"/>
  <!-- 寄存器堆网格 -->
  <g fill="#F2EDE3">
    <rect x="128" y="321" width="11" height="6" rx="1"/>
    <rect x="142" y="321" width="11" height="6" rx="1"/>
    <rect x="128" y="330" width="11" height="6" rx="1"/>
    <rect x="142" y="330" width="11" height="6" rx="1"/>
    <rect x="128" y="339" width="11" height="6" rx="1"/>
    <rect x="142" y="339" width="11" height="6" rx="1"/>
    <!-- ALU 梯形 -->
    <path d="M160,320 L178,327 L178,341 L160,348 L160,342 L170,334 L160,326 Z"/>
  </g>
  <text x="310" y="339" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5" fill="#F2EDE3">数据通路</text>

  <!-- 第3层：流水线微架构 -->
  <rect x="80" y="256" width="320" height="44" rx="8" fill="#A31F34"/>
  <!-- 五级流水线方框 -->
  <g fill="#F2EDE3" opacity="0.92">
    <rect x="96"  y="267" width="28" height="20" rx="2"/>
    <rect x="132" y="267" width="28" height="20" rx="2"/>
    <rect x="168" y="267" width="28" height="20" rx="2"/>
    <rect x="204" y="267" width="28" height="20" rx="2"/>
    <rect x="240" y="267" width="28" height="20" rx="2"/>
  </g>
  <g font-size="7" font-weight="800" text-anchor="middle" fill="#A31F34">
    <text x="110" y="280">IF</text>
    <text x="146" y="280">ID</text>
    <text x="182" y="280">EX</text>
    <text x="218" y="280">MEM</text>
    <text x="254" y="280">WB</text>
  </g>
  <!-- 阶段间箭头 -->
  <g stroke="#D9A94E" stroke-width="2" stroke-linecap="round">
    <line x1="124" y1="277" x2="132" y2="277"/>
    <line x1="160" y1="277" x2="168" y2="277"/>
    <line x1="196" y1="277" x2="204" y2="277"/>
    <line x1="232" y1="277" x2="240" y2="277"/>
  </g>
  <text x="356" y="283" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5" fill="#F2EDE3">流水线微架构</text>

  <!-- 第4层：缓存层次 -->
  <rect x="60" y="200" width="360" height="44" rx="8" fill="#8a1b2c"/>
  <!-- L3 / L2 / L1 三级横条 -->
  <g fill="#F2EDE3" opacity="0.9">
    <rect x="108" y="210" width="72" height="7" rx="2"/>
    <rect x="114" y="220" width="58" height="7" rx="2"/>
    <rect x="120" y="230" width="44" height="7" rx="2"/>
  </g>
  <g font-size="7" font-weight="700" fill="#8a1b2c" text-anchor="middle">
    <text x="144" y="217">L3 Cache</text>
    <text x="143" y="227">L2 Cache</text>
    <text x="142" y="237">L1 Cache</text>
  </g>
  <text x="320" y="227" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5" fill="#F2EDE3">缓存层次</text>

  <!-- 第5层：多核处理器 -->
  <rect x="140" y="148" width="200" height="44" rx="8" fill="#A31F34"/>
  <!-- 2×2 核心网格 -->
  <g fill="#F2EDE3" opacity="0.92">
    <rect x="158" y="157" width="19" height="17" rx="2"/>
    <rect x="181" y="157" width="19" height="17" rx="2"/>
    <rect x="158" y="177" width="19" height="10" rx="2"/>
    <rect x="181" y="177" width="19" height="10" rx="2"/>
  </g>
  <g font-size="7" font-weight="800" text-anchor="middle" fill="#A31F34">
    <text x="167" y="168">C0</text>
    <text x="190" y="168">C1</text>
    <text x="167" y="185">C2</text>
    <text x="190" y="185">C3</text>
  </g>
  <text x="290" y="175" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5" fill="#F2EDE3">多核处理器</text>

  <!-- 顶部穹顶元素，呼应站点 logo -->
  <path d="M205 148 A35 35 0 0 1 275 148 Z" fill="#D9A94E"/>
  <rect x="236" y="118" width="8" height="20" fill="#D9A94E"/>
  <circle cx="240" cy="112" r="6" fill="#D9A94E"/>
</svg>
