<svg width="100%" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>计算机系统主题插图</title>
  <desc>分层系统栈插图：从硬件存储到操作系统、网络、数据库与分布式服务，周围环绕电路与网络连接线，配色与站点 logo 一致（MIT 枣红、奶白、金色）。</desc>

  <defs>
    <linearGradient id="csBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A31F34" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D9A94E" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="240" cy="240" r="220" fill="url(#csBg)"/>

  <!-- 周围网络连接线与节点 -->
  <g stroke="#D9A94E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M70 120 H140"/>
    <path d="M70 120 V190"/>
    <path d="M410 110 H350"/>
    <path d="M410 110 V175"/>
    <path d="M62 330 H132"/>
    <path d="M132 330 V370"/>
    <path d="M418 350 H352"/>
    <path d="M352 350 V390"/>
  </g>
  <g fill="#D9A94E">
    <circle cx="70" cy="120" r="7"/>
    <circle cx="140" cy="120" r="5"/>
    <circle cx="70" cy="190" r="5"/>
    <circle cx="410" cy="110" r="7"/>
    <circle cx="350" cy="110" r="5"/>
    <circle cx="410" cy="175" r="5"/>
    <circle cx="62" cy="330" r="7"/>
    <circle cx="132" cy="370" r="5"/>
    <circle cx="418" cy="350" r="7"/>
    <circle cx="352" cy="390" r="5"/>
  </g>

  <!-- 系统分层栈：从下到上：硬件/存储、操作系统、网络、分布式/数据库、应用 -->
  <g>
    <!-- 第1层：硬件与存储 -->
    <rect x="120" y="368" width="240" height="44" rx="8" fill="#A31F34"/>
    <g fill="#F2EDE3">
      <rect x="140" y="384" width="22" height="14" rx="2"/>
      <rect x="168" y="384" width="22" height="14" rx="2"/>
      <rect x="196" y="384" width="22" height="14" rx="2"/>
      <text x="330" y="395" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">存储</text>
    </g>

    <!-- 第2层：操作系统 -->
    <rect x="100" y="312" width="280" height="44" rx="8" fill="#8a1b2c"/>
    <g fill="#F2EDE3">
      <circle cx="148" cy="334" r="11" fill="none" stroke="#F2EDE3" stroke-width="4"/>
      <circle cx="148" cy="334" r="3"/>
      <rect x="143" y="320" width="2.5" height="6"/>
      <rect x="143" y="342" width="2.5" height="6"/>
      <rect x="160" y="332" width="6" height="2.5"/>
      <rect x="131" y="332" width="6" height="2.5"/>
      <text x="330" y="339" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">操作系统</text>
    </g>

    <!-- 第3层：网络 -->
    <rect x="80" y="256" width="320" height="44" rx="8" fill="#A31F34"/>
    <g fill="none" stroke="#F2EDE3" stroke-width="3">
      <circle cx="132" cy="278" r="6" fill="#F2EDE3" stroke="none"/>
      <circle cx="156" cy="266" r="6" fill="#F2EDE3" stroke="none"/>
      <circle cx="156" cy="290" r="6" fill="#F2EDE3" stroke="none"/>
      <path d="M132 278 L156 266 M132 278 L156 290"/>
    </g>
    <text x="330" y="283" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1" fill="#F2EDE3">网络</text>

    <!-- 第4层：分布式 / 数据库 -->
    <rect x="60" y="200" width="360" height="44" rx="8" fill="#8a1b2c"/>
    <g fill="#F2EDE3">
      <ellipse cx="148" cy="213" rx="14" ry="5"/>
      <path d="M134 213 v12 a14 5 0 0 0 28 0 v-12" fill="none" stroke="#F2EDE3" stroke-width="3"/>
      <ellipse cx="148" cy="225" rx="14" ry="5" fill="none" stroke="#F2EDE3" stroke-width="3"/>
      <text x="330" y="227" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">分布式 / 数据库</text>
    </g>

    <!-- 第5层：应用与数据中心 -->
    <rect x="140" y="148" width="200" height="44" rx="8" fill="#A31F34"/>
    <g fill="#F2EDE3">
      <rect x="168" y="162" width="14" height="16" rx="2"/>
      <rect x="188" y="162" width="14" height="16" rx="2"/>
      <rect x="208" y="162" width="14" height="16" rx="2"/>
      <text x="290" y="175" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">数据中心</text>
    </g>
  </g>

  <!-- 顶部小穹顶元素，呼应站点 logo -->
  <path d="M205 148 A35 35 0 0 1 275 148 Z" fill="#D9A94E"/>
  <rect x="236" y="118" width="8" height="20" fill="#D9A94E"/>
  <circle cx="240" cy="112" r="6" fill="#D9A94E"/>
</svg>
